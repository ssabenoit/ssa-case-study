name: Nightly refresh

# Runs pipeline/refresh.py: extract -> load -> dbt build (prod) -> Elo and
# projections -> Metabase/Omni sync -> invariants.
#
# Repo secrets (Settings > Secrets and variables > Actions):
#   required: SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_ROLE,
#             SNOWFLAKE_WAREHOUSE, SNOWFLAKE_PRIVATE_KEY (PKCS#8 PEM, full text)
#   optional: MB_API_KEY (Metabase schema sync), OMNI_API_KEY (Omni schema
#             refresh), ALERT_WEBHOOK_URL (Slack-compatible run summary)
# Scheduled workflows only run from the default branch (main).

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: "Days back to extract"
        default: "2"
      refresh_reference:
        description: "Also refresh schedules/rosters/standings/teams"
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC ≈ after West Coast games finish and official stats post

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: DBT_ANALYTICS
      SNOWFLAKE_SCHEMA: STAGING
      DBT_BIN: dbt
      DBT_PROFILES_DIR: ci
      OMNI_BASE_URL: https://southshorellc.omniapp.co
      OMNI_MODEL_ID: f9824d6d-7291-4575-862b-de2b62872eb5
      OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pin dbt-core too: dbt-snowflake doesn't cap it, and unpinned it
      # resolves to a 2.0 pre-release that fails every node
      - run: pip install dbt-core==1.10.13 dbt-snowflake==1.10.3 -r requirements.txt
      # secrets can't be referenced in step `if:` conditions, so they're
      # passed through env and checked in the shell
      - name: Materialize Snowflake key
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          if [ -z "$SNOWFLAKE_PRIVATE_KEY" ]; then
            echo "::error::SNOWFLAKE_PRIVATE_KEY secret is not set"; exit 1
          fi
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/sf_key.p8"
          chmod 600 "$RUNNER_TEMP/sf_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/sf_key.p8" >> "$GITHUB_ENV"
      - name: Materialize Metabase key when configured
        env:
          MB_API_KEY: ${{ secrets.MB_API_KEY }}
        run: |
          if [ -n "$MB_API_KEY" ]; then
            printf '%s' "$MB_API_KEY" > "$RUNNER_TEMP/.mb_api_key"
            echo "MB_API_KEY_FILE=$RUNNER_TEMP/.mb_api_key" >> "$GITHUB_ENV"
          fi
      - run: dbt deps
      - run: dbt debug --target prod
      - name: Run refresh
        run: |
          python pipeline/refresh.py \
            --window-days "${{ inputs.window_days || '2' }}" \
            ${{ inputs.refresh_reference && '--refresh-reference' || '' }}
