# CI / scheduled-run dbt profile: credentials come from GitHub Actions secrets
# via env vars. Key-pair only (SNOWFLAKE_PRIVATE_KEY_PATH): Snowflake blocks
# password logins without MFA. Local development continues to use
# ~/.dbt/profiles.yml.
#   ci   -> isolated DBT_CI schema (PR builds, ci.yml)
#   prod -> PROD schema (nightly refresh, nightly.yml)
nhl_analytics:
  target: ci
  outputs:
    ci: &snowflake
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'NHL_PIPELINE_ROLE') }}"
      database: DBT_ANALYTICS
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'DBT_WH') }}"
      schema: DBT_CI
      threads: 4
    prod:
      <<: *snowflake
      schema: PROD
